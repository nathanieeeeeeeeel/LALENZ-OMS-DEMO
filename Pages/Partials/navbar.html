<script>
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("a").forEach(link => {
        link.addEventListener("auxclick", (e) => {
            if (e.button === 1) { // Middle mouse button
                e.preventDefault();
            }
        });
    });
    document.addEventListener("contextmenu", (e) => e.preventDefault());

    document.querySelectorAll("img, a").forEach(el => {
        el.setAttribute("draggable", "false");
    });

  // Mobile menu toggle
  document.getElementById("mobileMenuBtn")?.addEventListener("click", () => {
    document.getElementById("mobileMenu").classList.toggle("hidden");
  });

});
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const currentPath = window.location.pathname;
  const currentHash = window.location.hash;

  const navLinks = document.querySelectorAll(".nav-link");

  navLinks.forEach(link => {
    const linkURL = new URL(link.href);
    const linkPath = linkURL.pathname;
    const linkHash = linkURL.hash;

    // Reset first
    link.classList.remove(
      "text-emerald-600",
      "dark:text-emerald-400",
      "font-bold",
      "border-b-2",
      "border-emerald-400",
      "dark:border-emerald-600"
    );
    link.classList.add("text-gray-500", "dark:text-gray-400");

    // If link has hash (#about)
    if (linkHash) {
      if (linkPath === currentPath && linkHash === currentHash) {
        activateLink(link);
      }
    } else {
      // Normal page link (Home, Dashboard)
      if (
        (linkPath === currentPath ||
          (linkPath.endsWith("/index.php") &&
          currentPath === linkPath.replace("/index.php", "/"))) &&
        currentHash === ""
      ) {
        activateLink(link);
      }
    }
  });

  function activateLink(link) {
    link.classList.remove("text-gray-500", "dark:text-gray-400");
    link.classList.add(
      "text-emerald-600",
      "dark:text-emerald-400",
      "font-bold",
      "border-b-2",
      "border-emerald-400",
      "dark:border-emerald-600"
    );
  }
});
</script>
