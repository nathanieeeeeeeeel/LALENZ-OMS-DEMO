    <script>
        const currencyData = <?= json_encode($currencyData) ?>;
        const systemCurrency = <?= json_encode($systemCurrency) ?>;
        const activeSymbol =
            currencyData[systemCurrency]?.symbol || systemCurrency;

        const systemTimezone = <?= json_encode($systemTimezone) ?>;

        let ordersChart = null;

        /* =========================================================
        HELPERS
        ========================================================= */

        function money(value) {
            return `${activeSymbol}${Number(value || 0).toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            })}`;
        }

        function getStatus(order) {
            return String(order.status || "").trim().toLowerCase();
        }

        function isCancelled(order) {
            return getStatus(order) === "cancelled";
        }

        /*
        * Your PHP data appears to use:
        * YYYY-MM-DD HH:mm:ss
        *
        * Convert it safely to a Date object.
        */
        function parseOrderDate(value) {
            if (!value) return null;

            const normalized = String(value)
                .trim()
                .replace(" ", "T");

            const date = new Date(normalized + "Z");

            return isNaN(date.getTime()) ? null : date;
        }


        function getDateKey(date) {
            return date.toLocaleDateString("en-CA", {
                timeZone: systemTimezone
            });
        }

        function getTodayKey() {
            return getDateKey(new Date());
        }

        function getDayKeyFromOrder(order) {
            const date = parseOrderDate(order.order_datetime);
            return date ? getDateKey(date) : null;
        }

        function formatDate(date, options = {}) {
            return date.toLocaleDateString("en-PH", {
                timeZone: systemTimezone,
                ...options
            });
        }

        /* =========================================================
        TREND
        ========================================================= */

        function calcTrend(today, yesterday) {

            if (today === 0 && yesterday === 0) {
                return {
                    text: "",
                    color: "text-gray-400"
                };
            }

            if (yesterday === 0 && today > 0) {
                return {
                    text: '<i class="fa-solid fa-arrow-trend-up"></i> New activity today',
                    color: "text-emerald-500"
                };
            }

            if (today === 0 && yesterday > 0) {
                return {
                    text: 'No activity today',
                    color: "text-gray-400"
                };
            }

            const difference = ((today - yesterday) / yesterday) * 100;

            const icon = difference >= 0
                ? '<i class="fa-solid fa-arrow-trend-up"></i>'
                : '<i class="fa-solid fa-arrow-trend-down"></i>';

            return {
                text: `${icon} ${Math.abs(difference).toFixed(1)}% vs yesterday`,
                color: difference >= 0
                    ? "text-emerald-500"
                    : "text-red-500"
            };
        }

        /* =========================================================
        CHART DATA
        ========================================================= */

        function buildChart(data, range) {

            let labels = [];
            let orders = [];
            let sales = [];

            /* -----------------------------------------------------
            LAST 24 HOURS
            ----------------------------------------------------- */

            if (range === "24h") {

                const now = new Date();
                const cutoff = new Date(
                    now.getTime() - 24 * 60 * 60 * 1000
                );

                const grouped = {};

                data.forEach(order => {

                    const date = parseOrderDate(order.order_datetime);

                    if (!date || date < cutoff || date > now) {
                        return;
                    }

                    const hourKey = formatDate(date, {
                        month: "short",
                        day: "numeric"
                    }) + " " +
                    date.toLocaleTimeString("en-PH", {
                        timeZone: systemTimezone,
                        hour: "numeric",
                        hour12: true
                    });

                    if (!grouped[hourKey]) {
                        grouped[hourKey] = {
                            orders: 0,
                            sales: 0
                        };
                    }

                    grouped[hourKey].orders++;

                    if (!isCancelled(order)) {
                        grouped[hourKey].sales +=
                            Number(order.grand_total || 0);
                    }
                });

                labels = Object.keys(grouped);
                orders = labels.map(label => grouped[label].orders);
                sales = labels.map(label => grouped[label].sales);
            }

            /* -----------------------------------------------------
            LAST 7 / 15 / 30 / 60 DAYS
            ----------------------------------------------------- */

            else if (["7d", "15d", "30d", "60d"].includes(range)) {

                const days = {
                    "7d": 7,
                    "15d": 15,
                    "30d": 30,
                    "60d": 60
                };

                const daysBack = days[range];

                for (let i = daysBack - 1; i >= 0; i--) {

                    const date = new Date();

                    date.setDate(
                        date.getDate() - i
                    );

                    const dayKey = getDateKey(date);

                    labels.push(
                        formatDate(date, {
                            month: "short",
                            day: "numeric",
                            year: daysBack > 30 ? "numeric" : undefined
                        })
                    );

                    let orderCount = 0;
                    let salesTotal = 0;

                    data.forEach(order => {

                        if (getDayKeyFromOrder(order) !== dayKey) {
                            return;
                        }

                        orderCount++;

                        if (!isCancelled(order)) {
                            salesTotal +=
                                Number(order.grand_total || 0);
                        }
                    });

                    orders.push(orderCount);
                    sales.push(salesTotal);
                }
            }

            /* -----------------------------------------------------
            LAST 12 MONTHS
            ----------------------------------------------------- */

            else if (range === "1y") {

                const grouped = {};

                data.forEach(order => {

                    const date = parseOrderDate(order.order_datetime);

                    if (!date) return;

                    const year = Number(
                        date.toLocaleDateString("en-US", {
                            timeZone: systemTimezone,
                            year: "numeric"
                        })
                    );

                    const month = Number(
                        date.toLocaleDateString("en-US", {
                            timeZone: systemTimezone,
                            month: "numeric"
                        })
                    );

                    const key =
                        `${year}-${String(month).padStart(2, "0")}`;

                    if (!grouped[key]) {
                        grouped[key] = {
                            orders: 0,
                            sales: 0
                        };
                    }

                    grouped[key].orders++;

                    if (!isCancelled(order)) {
                        grouped[key].sales +=
                            Number(order.grand_total || 0);
                    }
                });

                const current = new Date();

                for (let i = 11; i >= 0; i--) {

                    const date = new Date(
                        current.getFullYear(),
                        current.getMonth() - i,
                        1
                    );

                    const year = date.getFullYear();
                    const month = date.getMonth() + 1;

                    const key =
                        `${year}-${String(month).padStart(2, "0")}`;

                    labels.push(
                        formatDate(date, {
                            month: "short",
                            year: "numeric"
                        })
                    );

                    orders.push(
                        grouped[key]?.orders || 0
                    );

                    sales.push(
                        grouped[key]?.sales || 0
                    );
                }
            }

            renderChart({
                labels,
                orders,
                sales
            });
        }

        /* =========================================================
        RENDER CHART
        ========================================================= */

        function renderChart(chartData) {

            const canvas =
                document.querySelector(".ordersChart");

            if (!canvas) return;

            if (ordersChart) {
                ordersChart.destroy();
            }

            const dark =
                document.documentElement.classList.contains("dark");

            const textColor =
                dark ? "#e5e7eb" : "#111827";

            const gridColor =
                dark
                    ? "rgba(255,255,255,0.08)"
                    : "rgba(0,0,0,0.08)";

            ordersChart = new Chart(canvas, {

                type: "line",

                data: {

                    labels: chartData.labels,

                    datasets: [

                        {
                            label: "Orders",

                            data: chartData.orders,

                            borderColor: "#3b82f6",

                            backgroundColor:
                                "rgba(59,130,246,0.12)",

                            borderWidth: 2,

                            tension: 0.4,

                            fill: true,

                            pointRadius: 3,

                            pointHoverRadius: 5,

                            yAxisID: "orders"
                        },

                        {
                            label: "Sales",

                            data: chartData.sales,

                            borderColor: "#10b981",

                            backgroundColor:
                                "rgba(16,185,129,0.12)",

                            borderWidth: 2,

                            tension: 0.4,

                            fill: true,

                            pointRadius: 3,

                            pointHoverRadius: 5,

                            yAxisID: "sales"
                        }

                    ]
                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    interaction: {
                        mode: "index",
                        intersect: false
                    },

                    plugins: {

                        legend: {
                            labels: {
                                color: textColor
                            }
                        },

                        tooltip: {

                            callbacks: {

                                label: function(context) {

                                    const value =
                                        Number(context.parsed.y || 0);

                                    if (
                                        context.dataset.label === "Sales"
                                    ) {
                                        return `Sales: ${money(value)}`;
                                    }

                                    return `Orders: ${value}`;
                                }
                            }
                        }
                    },

                    scales: {

                        x: {

                            ticks: {
                                color: textColor
                            },

                            grid: {
                                color: gridColor
                            }
                        },

                        orders: {

                            type: "linear",

                            position: "left",

                            beginAtZero: true,

                            ticks: {
                                color: textColor,
                                precision: 0
                            },

                            grid: {
                                color: gridColor
                            }
                        },

                        sales: {

                            type: "linear",

                            position: "right",

                            beginAtZero: true,

                            ticks: {

                                color: textColor,

                                callback: function(value) {
                                    return money(value);
                                }
                            },

                            grid: {
                                drawOnChartArea: false
                            }
                        }
                    }
                }
            });
        }

        /* =========================================================
        DASHBOARD
        ========================================================= */

        $(document).ready(function() {

            $.get({
                url:
                    "<?= $systemFolder ?>/Pages/Script/get_orders.php?t="
                    + Date.now(),

                dataType: "json",

                success: function(data) {

                    if (!Array.isArray(data)) {

                        console.error(
                            "Expected an array:",
                            data
                        );

                        toastr.error(
                            "Invalid dashboard data."
                        );

                        return;
                    }

                    /* -------------------------------------------------
                    DATE KEYS
                    ------------------------------------------------- */

                    const today =
                        getTodayKey();

                    const yesterdayDate =
                        new Date();

                    yesterdayDate.setDate(
                        yesterdayDate.getDate() - 1
                    );

                    const yesterday =
                        getDateKey(yesterdayDate);

                    /* -------------------------------------------------
                    KPI VALUES
                    ------------------------------------------------- */

                    let todaySales = 0;
                    let yesterdaySales = 0;

                    let ordersToday = 0;
                    let yesterdayOrders = 0;

                    let pendingOrders = 0;
                    let completedOrders = 0;

                    data.forEach(order => {

                        const day =
                            getDayKeyFromOrder(order);

                        const status =
                            getStatus(order);

                        /* TODAY */

                        if (day === today) {

                            if (status !== "cancelled") {

                                ordersToday++;

                                todaySales +=
                                    Number(order.grand_total || 0);

                                if (status === "pending") {
                                    pendingOrders++;
                                }

                                if (status === "completed") {
                                    completedOrders++;
                                }
                            }
                        }

                        /* YESTERDAY */

                        if (day === yesterday) {

                            if (status !== "cancelled") {

                                yesterdayOrders++;

                                yesterdaySales +=
                                    Number(order.grand_total || 0);
                            }
                        }
                    });

                    /* -------------------------------------------------
                    UPDATE KPI
                    ------------------------------------------------- */

                    $("#todaySales")
                        .text(money(todaySales));

                    const salesTrend =
                        calcTrend(
                            todaySales,
                            yesterdaySales
                        );

                    $("#todaySalesTrend")
                        .html(salesTrend.text)
                        .removeClass(
                            "text-gray-400 text-gray-500 text-emerald-600 text-emerald-500 text-red-600 text-red-500 dark:text-gray-500 dark:text-gray-400 dark:text-emerald-400 dark:text-red-400"
                        )
                        .addClass(salesTrend.color);


                    $("#ordersToday")
                        .text(ordersToday);

                    const ordersTrend =
                        calcTrend(
                            ordersToday,
                            yesterdayOrders
                        );

                    $("#ordersTodayTrend")
                        .html(ordersTrend.text)
                        .removeClass(
                            "text-gray-400 text-gray-500 text-emerald-600 text-emerald-500 text-red-600 text-red-500 dark:text-gray-500 dark:text-gray-400 dark:text-emerald-400 dark:text-red-400"
                        )
                        .addClass(ordersTrend.color);


                    $("#pendingOrders")
                        .text(pendingOrders);

                    $("#completedOrders")
                        .text(completedOrders);

                    /* -------------------------------------------------
                    INITIAL CHART
                    ------------------------------------------------- */

                    buildChart(data, "7d");

                    /* -------------------------------------------------
                    CHART RANGE
                    ------------------------------------------------- */

                    const chartRange =
                        document.getElementById("chartRange");

                    if (chartRange) {

                        chartRange.addEventListener(
                            "change",
                            function() {

                                buildChart(
                                    data,
                                    this.value
                                );
                            }
                        );
                    }

                    /* -------------------------------------------------
                    RECENT ORDERS
                    ------------------------------------------------- */

                    const recentOrders = [...data]
                        .sort(function(a, b) {

                            const dateA =
                                parseOrderDate(a.order_datetime);

                            const dateB =
                                parseOrderDate(b.order_datetime);

                            return dateB - dateA;
                        })
                        .slice(0, 5);

                    if (!recentOrders.length) {

                        $("#recentOrders").html(`
                            <div class="text-center py-4 text-gray-400">
                                No orders found.
                            </div>
                        `);

                        return;
                    }

                    /* -------------------------------------------------
                    STATUS
                    ------------------------------------------------- */

                    const statusStyles = {

                        "Pending":
                            "bg-orange-500/10 text-orange-500 border-orange-500/20",

                        "Out For Delivery":
                            "bg-blue-500/10 text-blue-500 border-blue-500/20",

                        "Cancelled":
                            "bg-red-500/10 text-red-500 border-red-500/20",

                        "Preparing":
                            "bg-yellow-500/10 text-yellow-500 border-yellow-500/20",

                        "Completed":
                            "bg-emerald-500/10 text-emerald-500 border-emerald-500/20",

                        "Scheduled":
                            "bg-purple-500/10 text-purple-500 border-purple-500/20",

                        "Ready":
                            "bg-green-500/10 text-green-500 border-green-500/20"
                    };

                    const statusNames = {

                        pending:
                            "Pending",

                        out_for_delivery:
                            "Out For Delivery",

                        cancelled:
                            "Cancelled",

                        preparing:
                            "Preparing",

                        scheduled:
                            "Scheduled",

                        ready:
                            "Ready",

                        completed:
                            "Completed",

                        delivered:
                            "Completed",

                        done:
                            "Completed"
                    };

                    function displayStatus(status) {

                        const normalized =
                            String(status || "")
                                .toLowerCase()
                                .trim()
                                .replace(/\s+/g, "_");

                        return (
                            statusNames[normalized]
                            || status
                            || "Unknown"
                        );
                    }

                    /* -------------------------------------------------
                    BUILD RECENT ORDERS
                    ------------------------------------------------- */

                    const ordersHtml =
                        recentOrders.map(order => {

                            const status =
                                displayStatus(order.status);

                            const statusClass =
                                statusStyles[status]
                                || "bg-gray-100 text-gray-800";

                            let itemCount = 1;

                            try {

                                const items =
                                    JSON.parse(
                                        order.order_items || "[]"
                                    );

                                if (Array.isArray(items)) {
                                    itemCount =
                                        items.length || 1;
                                }

                            } catch {

                                itemCount =
                                    Number(order.total_items || 1);
                            }

                            const total =
                                money(order.grand_total);

                            return `

                                <div class="
                                    relative
                                    p-[1px]
                                    rounded-2xl
                                    bg-gray-200/40
                                    dark:bg-gray-700/40
                                ">

                                    <div class="
                                        flex
                                        items-center
                                        justify-between
                                        gap-3
                                        p-4
                                        rounded-2xl
                                        bg-gray-200
                                        dark:bg-gray-950/75
                                        border
                                        border-white/30
                                        dark:border-gray-700/50
                                    ">

                                        <!-- LEFT -->

                                        <div class="min-w-0">

                                            <div class="
                                                text-sm
                                                font-black
                                                text-gray-900
                                                dark:text-gray-100
                                                truncate
                                            ">
                                                ${order.customer_name || "Guest"}
                                            </div>

                                            <div class="
                                                text-xs
                                                text-gray-500
                                                dark:text-gray-300
                                                mt-1
                                            ">
                                                Order #${order.id}
                                                ·
                                                ${itemCount}
                                                item${itemCount !== 1 ? "s" : ""}
                                                ·
                                                ${new Date(order.order_datetime.replace(" ", "T") + "Z").toLocaleString("en-PH", {
                                                    timeZone: systemTimezone || "UTC",
                                                    dateStyle: "medium",
                                                    timeStyle: "short"
                                                })}
                                            </div>

                                        </div>

                                        <!-- RIGHT -->

                                        <div class="
                                            text-right
                                            shrink-0
                                        ">

                                            <div class="
                                                text-sm
                                                font-black
                                                text-gray-900
                                                dark:text-gray-100
                                            ">
                                                ${total}
                                            </div>

                                            <div class="
                                                mt-1
                                                text-[10px]
                                                font-black
                                                uppercase
                                                px-3
                                                py-1.5
                                                rounded-full
                                                ${statusClass}
                                            ">
                                                ${status}
                                            </div>

                                        </div>

                                    </div>

                                </div>

                            `;

                        }).join("");

                    $("#recentOrders")
                        .html(ordersHtml);
                },

                error: function(xhr) {

                    console.error(
                        "Dashboard request failed:",
                        xhr.responseText
                    );

                    toastr.error(
                        "Failed to load dashboard data."
                    );
                }
            });
        });
        </script>

  </body>
</html>
